# Recovery only. Normal migrations are owned by Deploy hosted.
name: migrate
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to migrate without deploying services
        type: choice
        options: [development, production]
        default: development
permissions:
  contents: read
concurrency:
  group: dropway-environment-rollout
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/migrate-environment.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      source_sha: ${{ github.sha }}
