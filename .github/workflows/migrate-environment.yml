name: Migrate one environment
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      check_deploy_config:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Validate target and deployment prerequisites
        env:
          TARGET: ${{ inputs.environment }}
          CHECK_DEPLOY: ${{ inputs.check_deploy_config }}
          FLY_API_APP: ${{ vars.FLY_API_APP }}
          FLY_MCP_APP: ${{ vars.FLY_MCP_APP }}
          FLY_WORKER_APP: ${{ vars.FLY_WORKER_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_MCP_API_TOKEN: ${{ secrets.FLY_MCP_API_TOKEN }}
          FLY_WORKER_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == development || "$TARGET" == production ]]
          if [[ "$CHECK_DEPLOY" == true ]]; then
            : "${FLY_API_APP:?Set FLY_API_APP on the GitHub environment}"
            : "${FLY_MCP_APP:?Set FLY_MCP_APP on the GitHub environment}"
            : "${FLY_API_TOKEN:?Set FLY_API_TOKEN on the GitHub environment}"
            : "${FLY_MCP_API_TOKEN:?Set FLY_MCP_API_TOKEN on the GitHub environment}"
            [[ "$FLY_API_APP" =~ ^[a-z0-9][a-z0-9-]*$ ]]
            [[ "$FLY_MCP_APP" =~ ^[a-z0-9][a-z0-9-]*$ ]]
            [[ "$FLY_API_APP" != "$FLY_MCP_APP" ]]
            if [[ -n "$FLY_WORKER_APP" ]]; then
              [[ "$FLY_WORKER_APP" =~ ^[a-z0-9][a-z0-9-]*$ ]]
              [[ "$FLY_WORKER_APP" != "$FLY_API_APP" && "$FLY_WORKER_APP" != "$FLY_MCP_APP" ]]
              : "${FLY_WORKER_API_TOKEN:?Set FLY_WORKER_API_TOKEN for the configured worker}"
            fi
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Migrate app, billing, then identity
        env:
          TARGET: ${{ inputs.environment }}
          DEV_APP_DSN: ${{ secrets.DEV_DATABASE_OWNER_URL }}
          DEV_BILLING_DSN: ${{ secrets.DEV_BILLING_OWNER_URL }}
          PROD_APP_DSN: ${{ secrets.PROD_DATABASE_OWNER_URL }}
          PROD_BILLING_DSN: ${{ secrets.PROD_BILLING_OWNER_URL }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            development) export APP_DSN="$DEV_APP_DSN" BILLING_DSN="$DEV_BILLING_DSN" ;;
            production) export APP_DSN="$PROD_APP_DSN" BILLING_DSN="$PROD_BILLING_DSN" ;;
            *) exit 1 ;;
          esac
          scripts/deploy/migrate.sh
