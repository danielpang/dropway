# Migrations are owned by migrate.yml, never by this deployment workflow.
name: Deploy hosted
on:
  workflow_run:
    workflows: [migrate]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: dropway-environment-rollout
  cancel-in-progress: false
jobs:
  revision:
    # Automatic migrate runs validate both environments after successful CI.
    # Manual migration runs are recovery-only and must not trigger deployment.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: revision
        env:
          MIGRATED_SHA: ${{ github.event.workflow_run.head_sha }}
          MIGRATION_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A stale migrate run may succeed with both migration jobs skipped.
          # Require actual successful execution of both jobs, not just run success.
          migrated=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$MIGRATION_RUN_ID/jobs" \
            --jq '[.[].jobs[] | select(.name == "migrate-development" or .name == "migrate-production")] | length == 2 and all(.[]; .conclusion == "success")')
          [[ "$migrated" == true ]] || exit 0
          sha="$MIGRATED_SHA"
          # Ignore migration completions for a revision superseded on main.
          [[ "$sha" == "$(git rev-parse HEAD)" ]] || exit 0
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    needs: revision
    if: needs.revision.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - name: Build immutable release images once
        env:
          SOURCE_SHA: ${{ needs.revision.outputs.sha }}
        run: |
          set -euo pipefail
          docker build --build-arg DROPWAY_BUILD_TAGS=cloud -f services/api/Dockerfile -t "dropway-api:$SOURCE_SHA" .
          docker build -f services/mcp/Dockerfile -t "dropway-mcp:$SOURCE_SHA" .
          docker build -f services/room-worker/Dockerfile -t "dropway-room-worker:$SOURCE_SHA" .
          python3 - <<'PY'
          import json, os, subprocess
          sha = os.environ['SOURCE_SHA']
          images = {service: subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', f'dropway-{service}:{sha}'], text=True).strip() for service in ('api', 'mcp', 'room-worker')}
          with open('image-ids.json', 'w') as f:
              json.dump(images, f)
          PY
          docker save "dropway-api:$SOURCE_SHA" "dropway-mcp:$SOURCE_SHA" "dropway-room-worker:$SOURCE_SHA" | gzip > fly-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: fly-images-${{ needs.revision.outputs.sha }}
          path: |
            fly-images.tar.gz
            image-ids.json
          retention-days: 3
  deploy-production:
    needs: [revision, build]
    uses: ./.github/workflows/deploy-fly-environment.yml
    secrets: inherit
    with:
      environment: production
      source_sha: ${{ needs.revision.outputs.sha }}
