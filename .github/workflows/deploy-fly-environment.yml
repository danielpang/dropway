name: Deploy Fly environment
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      source_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: fly-images-${{ inputs.source_sha }}
      - name: Load tested image artifact
        run: gunzip -c fly-images.tar.gz | docker load
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: '0.5.3'
      - name: Publish images and deploy API, MCP, then worker
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          FLY_API_APP: ${{ vars.FLY_API_APP }}
          FLY_MCP_APP: ${{ vars.FLY_MCP_APP }}
          FLY_WORKER_APP: ${{ inputs.environment == 'production' && 'dropway-worker-production' || vars.FLY_WORKER_APP }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_MCP_API_TOKEN: ${{ secrets.FLY_MCP_API_TOKEN }}
          FLY_WORKER_API_TOKEN: ${{ secrets.FLY_WORKER_API_TOKEN }}
        run: scripts/deploy/fly.sh
