# Dedicated worker. CI supplies the environment-specific FLY_WORKER_APP.
# No public service; deployment is skipped when that variable is unset.
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "services/room-worker/Dockerfile"

[env]
  NODE_ENV = "production"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[restart]]
  policy = "always"
